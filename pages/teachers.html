<div class="page-header">
    <div class="page-title">
        <h1>Teachers</h1>
        <p>Manage your teacher database and their associated cheques.</p>
    </div>
    <div class="header-actions">
        <button class="btn btn-primary" onclick="openAddTeacherModal()">
            <i data-lucide="user-plus"></i> Add Teacher
        </button>
    </div>
</div>

<div class="card">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Teacher Name</th>
                    <th>Account No.</th>
                    <th>Contact</th>
                    <th>Total Cheques</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="teachers-table-body">
                <tr><td colspan="5" class="text-center"><div class="spinner" style="width:20px;height:20px;margin:auto;"></div></td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add Teacher Modal -->
<div id="add-teacher-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: var(--bg-color); border-radius: 12px; width: 100%; max-width: 400px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 18px; font-weight: 600;">Add New Teacher</h2>
            <button class="btn btn-text" onclick="closeAddTeacherModal()" style="padding: 4px;"><i data-lucide="x"></i></button>
        </div>
        <form id="add-teacher-form" onsubmit="submitAddTeacher(event)">
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" id="t-name" class="form-control" required placeholder="Full Name">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="t-email" class="form-control" placeholder="Optional">
            </div>
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="text" id="t-phone" class="form-control" placeholder="Optional">
            </div>
            <div class="form-group">
                <label class="form-label">Account Number</label>
                <input type="text" id="t-account" class="form-control" required placeholder="Bank Account Number">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                <button type="button" class="btn btn-secondary" onclick="closeAddTeacherModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="btn-submit-teacher">Save Teacher</button>
            </div>
        </form>
    </div>
</div>
