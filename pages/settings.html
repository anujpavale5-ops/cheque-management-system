<div class="page-header">
    <div class="page-title">
        <h1>Settings</h1>
        <p>Manage application preferences and notifications.</p>
    </div>
</div>

<div class="flex" style="gap: 32px; flex-wrap: wrap;">
    <!-- Profile -->
    <div class="card" style="flex: 1; min-width: 300px;">
        <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 24px;">Profile Settings</h2>
        <form onsubmit="event.preventDefault(); window.showToast('Profile updated!', 'success');">
            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" value="Anuj" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" value="anuj@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" value="+91 9876543210" required>
            </div>
            <button class="btn btn-primary mt-4" type="submit">Save Profile</button>
        </form>
    </div>

    <!-- Notifications & Appearance -->
    <div class="card" style="flex: 1; min-width: 300px;">
        <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 24px;">Preferences</h2>
        
        <div style="margin-bottom: 32px;">
            <h3 style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; color: var(--text-secondary);">Appearance</h3>
            <div class="flex items-center justify-between" style="padding: 16px; border: 1px solid var(--border); border-radius: var(--border-radius);">
                <div class="flex items-center gap-3">
                    <i data-lucide="moon" style="width: 18px; color: var(--text-secondary);"></i>
                    <span style="font-size: 14px; font-weight: 500;">Dark Mode</span>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="document.getElementById('theme-toggle-btn').click()">Toggle</button>
            </div>
        </div>
        
        <div>
            <h3 style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; color: var(--text-secondary);">Notifications (Simulated)</h3>
            
            <div class="flex items-center justify-between" style="padding: 16px; border-bottom: 1px solid var(--border);">
                <span style="font-size: 14px; font-weight: 500;">Deposit notifications</span>
                <input type="checkbox" checked>
            </div>
            <div class="flex items-center justify-between" style="padding: 16px; border-bottom: 1px solid var(--border);">
                <span style="font-size: 14px; font-weight: 500;">OCR alerts</span>
                <input type="checkbox" checked>
            </div>
            <div class="flex items-center justify-between" style="padding: 16px;">
                <span style="font-size: 14px; font-weight: 500;">Teacher alerts</span>
                <input type="checkbox" checked>
            </div>
        </div>
    </div>
</div>
