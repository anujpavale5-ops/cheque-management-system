<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChequeTracker - Premium Collection System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<!-- Body class controlled by JS for sidebar state -->
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-wrapper">
                    <i data-lucide="check-square" class="logo-icon"></i>
                    <h2>ChequeTracker</h2>
                </div>
                <!-- Desktop Toggle Button -->
                <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Toggle Sidebar">
                    <i data-lucide="panel-left-close" id="sidebar-toggle-icon"></i>
                </button>
                <!-- Mobile Close Button -->
                <button class="mobile-close-btn" id="mobile-close-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#/dashboard" class="nav-item active" data-path="/dashboard" data-tooltip="Dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#/teachers" class="nav-item" data-path="/teachers" data-tooltip="Teachers">
                    <i data-lucide="users"></i>
                    <span>Teachers</span>
                </a>
                <a href="#/cheques" class="nav-item" data-path="/cheques" data-tooltip="Cheques">
                    <i data-lucide="receipt"></i>
                    <span>Cheques</span>
                </a>
                <a href="#/ocr" class="nav-item" data-path="/ocr" data-tooltip="OCR Scanner">
                    <i data-lucide="scan-line"></i>
                    <span>OCR Scanner</span>
                </a>
                <a href="#/deposits" class="nav-item" data-path="/deposits" data-tooltip="Deposits">
                    <i data-lucide="landmark"></i>
                    <span>Deposits</span>
                </a>
                <a href="#/reports" class="nav-item" data-path="/reports" data-tooltip="Reports">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Reports</span>
                </a>
                <a href="#/settings" class="nav-item" data-path="/settings" data-tooltip="Settings">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile" data-tooltip="Anuj&#xa;Collector">
                    <div class="avatar">A</div>
                    <div class="user-info">
                        <span class="user-name">Anuj</span>
                        <span class="user-role">Collector</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="main-wrapper" id="main-wrapper">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="menu-btn" id="menu-btn">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="search-bar">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" placeholder="Search cheques, teachers..." id="global-search">
                        <div class="search-results" id="search-results-dropdown" style="display: none;"></div>
                    </div>
                </div>
                
                <div class="header-right">
                    <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Theme">
                        <i data-lucide="moon"></i>
                    </button>
                    <div class="notification-wrapper">
                        <button class="notification-btn" id="notification-btn">
                            <i data-lucide="bell"></i>
                            <span class="notification-badge" id="notification-badge" style="display: none;">0</span>
                        </button>
                        <!-- Notification Dropdown -->
                        <div class="notification-dropdown" id="notification-dropdown" style="display: none;">
                            <div class="dropdown-header">
                                <h3>Notifications</h3>
                                <button class="mark-all-read" id="mark-all-read">Mark all as read</button>
                            </div>
                            <div class="dropdown-content" id="notification-list"></div>
                            <div class="dropdown-footer">
                                <a href="#/settings">Notification Settings</a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic Page Content -->
            <main class="main-content" id="app-content">
                <div class="loading-state">
                    <div class="spinner"></div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Application Logic -->
    <script src="js/data.js?v=4"></script>
    <script src="js/api.js?v=6"></script>
    <script src="js/app.js?v=4"></script>
    
    <!-- Page Controllers -->
    <script src="js/dashboard.js?v=2"></script>
    <script src="js/ocr.js?v=4"></script>
    <script src="js/cheques.js?v=3"></script>
    <script src="js/teachers.js?v=2"></script>
    <script src="js/deposits.js?v=2"></script>
    <script src="js/settings.js?v=2"></script>
</body>
</html>
